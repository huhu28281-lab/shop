<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DESIGN3 Preview</title>
<style>
:root{--bg:#fff;--muted:#f2f4f6;--text:#232b35;--sub:#64748b;--line:#e0e3e7;--blue:#4269f6;--price:#ba2d1b;--radius:10px}*{box-sizing:border-box}body{margin:0;background:var(--muted);color:var(--text);font-family:"Malgun Gothic",Arial,sans-serif;font-size:14px;line-height:1.5}.header{height:74px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:32px;padding:0 48px}.home{font-size:16px;font-weight:700;color:var(--blue)}.search{height:42px;display:flex;align-items:center;border:1px solid var(--blue);flex:1;max-width:600px;padding:0 14px;color:var(--sub)}.search span{flex:1}.search b{font-size:18px;color:var(--blue)}.right{margin-left:auto;text-align:right}.langs{color:var(--sub);margin-bottom:4px}.langs strong{color:var(--blue)}.account{font-size:12px;color:var(--sub)}main{max-width:1200px;margin:0 auto;padding:32px 24px 64px}.hero{background:linear-gradient(120deg,#eaf0ff,#fff 62%,#fff7de);border:1px solid var(--line);border-radius:12px;padding:30px 32px;margin-bottom:24px;display:flex;justify-content:space-between;align-items:center}.eyebrow{color:var(--sub);font-size:14px}.hero h1{font-size:28px;line-height:1.25;margin:4px 0 8px}.hero p{margin:0;color:var(--sub)}.hero-orb{width:170px;height:110px;border-radius:60% 40% 55% 45%;background:linear-gradient(135deg,#4269f6,#a7bbff);opacity:.85}.layout{display:grid;grid-template-columns:190px 1fr;gap:24px}.side{background:#fff;border:1px solid var(--line);border-radius:10px;padding:20px;height:max-content}.side h2{font-size:18px;margin:0 0 16px}.side a{display:block;padding:9px 0;color:var(--sub)}.side a.active{color:var(--blue);font-weight:700}.content{background:#fff;border:1px solid var(--line);border-radius:10px;padding:24px}.bar{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:20px}.bar h2{font-size:20px;margin:0}.sort{border:1px solid var(--line);border-radius:8px;padding:8px 12px;color:var(--sub);background:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}.card{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff}.image{aspect-ratio:1;background:var(--muted);display:grid;place-items:center;position:relative;border-radius:8px;overflow:hidden}.image img{width:100%;height:100%;object-fit:contain}.hit{position:absolute;left:8px;top:8px;background:#ff9f00;color:#fff;font-size:12px;font-weight:700;padding:3px 7px;border-radius:6px}.cat{font-size:12px;color:var(--sub);margin-top:12px}.name{font-size:15px;font-weight:600;line-height:1.4;height:42px;overflow:hidden}.price{font-size:18px;font-weight:700;color:var(--price);margin-top:7px}.preview-note{font-size:12px;color:var(--sub);margin:0 0 14px}
</style></head>
<body><header class="header"><a class="home" href="#">⌂ 홈</a><div class="search"><span>상품을 검색하세요</span><b>⌕</b></div><div class="right"><div class="langs"><strong>한국어</strong>　中文　English</div><div class="account">로그인　회원가입　마이페이지　 장바구니 (2)</div></div></header><main><section class="hero"><div><div class="eyebrow">상품 목록</div><h1>상품</h1><p>오늘 추천하는 상품을 한눈에 확인하세요.</p></div><div class="hero-orb" aria-hidden="true"></div></section><div class="layout"><aside class="side"><h2>카테고리</h2><a class="active" href="#">전체</a><a href="#">잡화</a><a href="#">뷰티</a><a href="#">신발</a><a href="#">식품</a></aside><section class="content"><div class="bar"><h2>상품 목록 <small>(24개)</small></h2><button class="sort">추천순 ▾</button></div><p class="preview-note">DESIGN3 제안: 콘텐츠 폭을 1200px로 제한하고, 카드·검색·사이드바에 동일한 모서리와 여백 체계를 적용한 시안입니다.</p><div class="grid"><article class="card"><div class="image"><span class="hit">HIT</span><img src="/products/bag.jpg" alt="토트백"></div><div class="cat">잡화</div><div class="name">미니멀 토트백</div><div class="price">89,000원</div></article><article class="card"><div class="image"><img src="/products/perfume.jpg" alt="향수"></div><div class="cat">뷰티</div><div class="name">시트러스 오 드 뚜왈렛</div><div class="price">78,000원</div></article><article class="card"><div class="image"><span class="hit">HIT</span><img src="/products/shoe.jpg" alt="운동화"></div><div class="cat">신발</div><div class="name">쿠션 러닝화</div><div class="price">112,000원</div></article><article class="card"><div class="image"><img src="/products/pasta.jpg" alt="파스타"></div><div class="cat">식품</div><div class="name">이탈리아 숏 파스타</div><div class="price">6,500원</div></article></div></section></div></main></body></html>
